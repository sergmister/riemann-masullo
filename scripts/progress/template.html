<div class="page" id="app"></div>

<script>const DATA = /*__DATA__*/null;</script>
<script>
(function () {
'use strict';
const D = DATA, app = document.getElementById('app');
if (!D) { app.textContent = 'No data: this is the template. Run python3 scripts/progress/build.py.'; return; }

/* ---------- small helpers ---------- */
function h(tag, attrs) {
  const el = document.createElement(tag);
  for (const k in attrs || {}) {
    const v = attrs[k];

    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);

}

}
const NS = 'http://www.w3.org/2000/svg';
function s(tag, attrs) {
  const el = document.createElementNS(NS, tag);

  for (let i = 2; i < arguments.length; i++) if (arguments[i] != null) el.appendChild(
    typeof arguments[i] === 'object' ? arguments[i] : document.createTextNode(String(arguments[i])));
  return el;
}
const ext = (href, text, cls) => h('a', { href, target: '_blank', rel: 'noopener', class: cls }, text);
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const fmtPages = pp => pp && pp.length ? (pp.length === 1 && pp[0][0] === pp[0][1] ? 'p. ' : 'pp. ') +
  pp.map(p => p[0] === p[1] ? p[0] : p[0] + '–' + p[1]).join(' and ') : '';
const countPages = pp => pp.reduce((a, p) => a + p[1] - p[0] + 1, 0);

/* ---------- data access ---------- */
const N = 0, KIND = 1, STATE = 2, GROUP = 3, FILE = 4, LINE = 5, ISSUE = 6, PAGE = 7, PAPER = 8, TEXT = 9,
  FLAGS = 10, BELOW = 11, STMT = 12, PROOF = 13, WHO = 14;
const repo = D.meta.repo, sha = D.meta.commit;
const groupByKey = {}, groupById = {};
D.groups.forEach((g, i) => { g.idx = i; groupByKey[g.key] = g; if (g.id != null) groupById[g.id] = g; });
const usedBy = D.decls.map(() => []);
D.decls.forEach((d, i) => { d[STMT].concat(d[PROOF]).forEach(j => usedBy[j].push(i)); });
const itemOf = new Array(D.decls.length);
D.groups.forEach(g => g.items.forEach((it, k) => it.decls.forEach(i => { itemOf[i] = k; })));
const neededBy = {};
D.groups.forEach(g => g.needs.forEach(n => { (neededBy[n] = neededBy[n] || []).push(g.id); }));

const KINDS = { t: 'theorem', d: 'definition', a: 'abbreviation', s: 'structure', c: 'class',
  i: 'inductive type', n: 'instance', o: 'opaque constant', x: 'axiom' };
const STATE_WORD = { complete: 'complete', stated: 'stated', digesting: 'being digested', ready: 'ready to digest', blocked: 'blocked', extra: 'support' };
// Complete: statements are in and every theorem is proved without resting on a sorry.
const secState = g => g.state === 'stated' && g.thms > 0 && g.solid === g.thms ? 'complete' : g.state;
// An open, unclaimed section can already have part of its statements on main.
const stateWord = g => g.state === 'ready' && g.defs + g.thms ? 'stated in part, rest ready to digest' : STATE_WORD[secState(g)];
const srcUrl = d => repo + '/blob/' + sha + '/' + D.files[d[FILE]] + '#L' + d[LINE];
const issueUrl = n => repo + '/issues/' + n;
function glyphClass(d) {
  let c = 'g ' + (d[KIND] === 't' ? 't' : 'd');
  if (d[KIND] === 't') {
    c += ' ' + (d[STATE] === 'proved' && (d[BELOW] > 0 || (d[FLAGS] & 4)) ? 'soft' : d[STATE]);
  }
  if (d[FLAGS] & 8) c += ' helper';
  if (/^Printed\./.test(d[N])) c += d[KIND] === 't' ? ' refute' : ' printed';
  return c;
}
function stateText(d) {
  if (d[KIND] !== 't') return KINDS[d[KIND]] + (d[BELOW] > 0 ? ', uses ' + plural(d[BELOW], 'unproved lemma') : '');
  switch (d[STATE]) {
    case 'proved': return d[BELOW] > 0 ? 'proved, rests on ' + plural(d[BELOW], 'open lemma') :
      (d[FLAGS] & 4 ? 'proved, rests on an instance with a sorry' : 'proved');
    case 'claimed': return 'claimed' + (d[WHO].length ? ' by ' + d[WHO].join(', ') : '');
    case 'open': return 'open';
    default: return 'open, no issue yet';
  }
}
const glyph = (d, i) => h('i', { class: glyphClass(d), title: d[N] + ' — ' + stateText(d), 'data-d': i });

/* ---------- icons for section states ---------- */
function stateIcon(state) {
  const svg = s('svg', { class: 'ico', width: 13, height: 13, viewBox: '0 0 13 13', 'aria-hidden': 'true' });
  const ring = col => s('circle', { cx: 6.5, cy: 6.5, r: 5.25, fill: 'none', stroke: col, 'stroke-width': 1.5 });
  if (state === 'complete') {
    svg.appendChild(s('circle', { cx: 6.5, cy: 6.5, r: 6, fill: 'var(--ok)' }));
    svg.appendChild(s('path', { d: 'M3.6 6.8l2 2 3.8-4.2', fill: 'none', stroke: 'var(--surface)', 'stroke-width': 1.6,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
  } else if (state === 'stated') {
    svg.appendChild(ring('var(--ok)'));
    svg.appendChild(s('path', { d: 'M3.9 6.8l1.8 1.8 3.4-3.8', fill: 'none', stroke: 'var(--ok)', 'stroke-width': 1.4,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
  } else if (state === 'digesting') {
    svg.appendChild(ring('var(--wip)'));
    svg.appendChild(s('path', { d: 'M6.5 1.25a5.25 5.25 0 0 1 0 10.5z', fill: 'var(--wip-fill)' }));
  } else if (state === 'ready') {
    svg.appendChild(ring('var(--accent)'));
    svg.appendChild(s('circle', { cx: 6.5, cy: 6.5, r: 2.2, fill: 'var(--accent)' }));
  } else if (state === 'blocked') {
    svg.appendChild(ring('var(--ink-3)'));
    svg.appendChild(s('path', { d: 'M3.6 6.5h5.8', stroke: 'var(--ink-3)', 'stroke-width': 1.6, 'stroke-linecap': 'round' }));
  } else {
    svg.appendChild(s('rect', { x: 2, y: 2, width: 9, height: 9, rx: 2, fill: 'none', stroke: 'var(--ink-3)', 'stroke-width': 1.5 }));
  }
  return svg;
}
function progressBar(g) {
  const bar = h('span', { class: 'bar', role: 'img',
    'aria-label': g.proved + ' of ' + g.thms + ' theorems proved' });
  if (g.thms) {
    if (g.proved) bar.appendChild(h('i', { class: 'b-ok', style: 'width:' + (100 * g.proved / g.thms) + '%' }));
    if (g.claimed) bar.appendChild(h('i', { class: 'b-wip', style: 'width:' + (100 * g.claimed / g.thms) + '%' }));
  }
  return bar;
}

/* ---------- grid diagram: cards on a grid, arrows routed through the gutters ----------
   opts: cols (fixed) or minPitch (wrap), maxPitch, cardH, gapX, layout(cols) ->
   { cards: [{key, col, row, el}], heads: [{row, el, h, col?}] }, edges: [[to, from, kind]]
   (an edge runs from a dependency `from` to its dependent `to`), onHover. */
function diagram(opts) {
  const wrap = h('div', { class: 'dg-wrap' });
  const root = h('div', { class: 'dg' + (opts.plain ? ' plain' : '') });
  const svg = s('svg', { class: 'edges', 'aria-hidden': 'true' });
  wrap.appendChild(root);
  let lastW = -1, cardsByKey = {}, edgeEls = [], pinned = null;
  const STEP = 5, R = 5, PAD = 12;

  function draw() {
    const W = Math.floor(wrap.clientWidth);
    if (!W || W === lastW) return;
    lastW = W;
    const gapX = opts.gapX;
    let cols, pitch;
    if (opts.cols) { cols = opts.cols; pitch = clamp((W - 2 * PAD) / cols, opts.minPitch, opts.maxPitch); }
    else { cols = Math.max(1, Math.floor((W - 2 * PAD) / opts.minPitch)); pitch = Math.min(opts.maxPitch, (W - 2 * PAD) / cols); }
    const L = opts.layout(cols), cardW = pitch - gapX, cardH = opts.cardH;
    const pos = {}, occ = {};
    let rows = 0;
    L.cards.forEach(c => { pos[c.key] = c; occ[c.row + ':' + c.col] = c.key; rows = Math.max(rows, c.row + 1); });
    cardsByKey = pos;

    // Classify edges and hand out tracks.
    const edges = [];
    opts.edges.forEach(e => {
      const t = pos[e[0]], f = pos[e[1]];
      if (!t || !f) return;
      let type;
      if (t.col === f.col && t.row > f.row) {
        type = 'straight';
        for (let r = f.row + 1; r < t.row; r++) if (occ[r + ':' + f.col]) { type = 'far'; break; }
      } else if (t.row === f.row && Math.abs(t.col - f.col) === 1) type = 'side';
      else if (t.row === f.row + 1) type = 'near';
      else type = 'far';
      edges.push({ t, f, kind: e[2] || 0, type });
    });
    const collect = {}, nTracks = new Array(rows + 1).fill(0);
    edges.filter(e => e.type === 'near' || e.type === 'far').map(e => e.t)
      .sort((a, b) => a.row - b.row || a.col - b.col)
      .forEach(t => { if (collect[t.key] == null) collect[t.key] = nTracks[t.row]++; });
    const gutterUse = {};
    edges.forEach(e => {
      if (e.type !== 'far') return;
      e.gutter = e.t.col > e.f.col ? e.f.col + 1 : e.t.col < e.f.col ? e.f.col : e.f.col + 1;
      (gutterUse[e.gutter] = gutterUse[e.gutter] || []).push(e.t);
    });
    const gutterTrack = {};
    Object.keys(gutterUse).forEach(gk => {
      const seen = [], m = {};
      gutterUse[gk].sort((a, b) => a.row - b.row || a.col - b.col).forEach(t => { if (m[t.key] == null) { m[t.key] = seen.length; seen.push(t); } });
      const step = Math.min(4, Math.max(1.5, (gapX - 8) / Math.max(1, seen.length)));
      Object.keys(m).forEach(k => { m[k] = (m[k] - (seen.length - 1) / 2) * step; });
      gutterTrack[gk] = m;
    });

    // Vertical positions: each row is preceded by a gap that holds, top to bottom,
    // the exit track of the row above, an optional heading, and the collector tracks.
    const headH = new Array(rows + 1).fill(0);
    L.heads.forEach(hd => { headH[hd.row] = Math.max(headH[hd.row], hd.h); });
    // With opts.gap the gap has one height whatever runs through it, so that a row does
    // not move when a proof lands and brings new arrows.
    const y = [], headY = [], step = [];
    let cur = 0;
    for (let r = 0; r < rows; r++) {
      cur += r ? 12 : 0;
      if (r && headH[r]) cur += 16;
      headY[r] = cur; cur += headH[r];
      const n = nTracks[r];
      if (opts.gap) { step[r] = n > 1 ? Math.min(STEP, (opts.gap - 26) / (n - 1)) : 0; cur += r ? opts.gap - 12 : 0; }
      else { step[r] = STEP; cur += (n ? 9 + n * STEP : 0) + (r ? 7 : 0); }
      y[r] = cur; cur += cardH;
    }
    const totalH = cur + 4, totalW = 2 * PAD + cols * pitch;
    const colX = c => PAD + c * pitch + gapX / 2, gutterX = g => PAD + g * pitch;

    root.textContent = '';
    root.style.width = totalW + 'px'; root.style.height = totalH + 'px';
    svg.textContent = '';
    svg.setAttribute('width', totalW); svg.setAttribute('height', totalH);
    svg.setAttribute('viewBox', '0 0 ' + totalW + ' ' + totalH);
    root.appendChild(svg);
    L.heads.forEach(hd => {
      const st = hd.el.style; st.top = headY[hd.row] + 'px';
      if (hd.col != null) { st.left = colX(hd.col) + 'px'; st.width = cardW + 'px'; st.height = hd.h - 6 + 'px'; }
      else { st.left = colX(0) + 'px'; st.maxWidth = totalW - colX(0) + 'px'; }
      root.appendChild(hd.el);
    });
    L.cards.forEach(c => {
      const st = c.el.style;
      st.left = colX(c.col) + 'px'; st.top = y[c.row] + 'px'; st.width = cardW + 'px'; st.height = cardH + 'px';
      root.appendChild(c.el);
    });

    // Paths.
    edgeEls = [];
    edges.forEach(e => {
      const t = e.t, f = e.f, fx = colX(f.col) + cardW / 2, tx = colX(t.col) + cardW / 2;
      const fTop = y[f.row], fBot = y[f.row] + cardH, tTop = y[t.row];
      let pts, head;
      const down = (x, yy) => [[x - 4, yy - 7], [x + 4, yy - 7], [x, yy]];
      if (e.type === 'straight') { pts = [[fx, fBot], [tx, tTop - 6]]; head = down(tx, tTop); }
      else if (e.type === 'side') {
        const ym = fTop + cardH / 2, right = t.col > f.col;
        const x0 = right ? colX(f.col) + cardW : colX(f.col), x1 = right ? colX(t.col) : colX(t.col) + cardW;
        pts = [[x0, ym], [x1 + (right ? -6 : 6), ym]];
        head = right ? [[x1 - 7, ym - 4], [x1 - 7, ym + 4], [x1, ym]] : [[x1 + 7, ym - 4], [x1 + 7, ym + 4], [x1, ym]];
      } else {
        const cy = tTop - 9 - collect[t.key] * step[t.row];
        if (e.type === 'near') pts = [[fx, fBot], [fx, cy], [tx, cy], [tx, tTop - 6]];
        else {
          const gx = gutterX(e.gutter) + gutterTrack[e.gutter][t.key];
          if (t.row > f.row) pts = [[fx, fBot], [fx, fBot + 6], [gx, fBot + 6], [gx, cy], [tx, cy], [tx, tTop - 6]];
          else {
            const ym = fTop + cardH / 2, x0 = e.gutter > f.col ? colX(f.col) + cardW : colX(f.col);
            pts = [[x0, ym], [gx, ym], [gx, cy], [tx, cy], [tx, tTop - 6]];
          }
        }
        head = down(tx, tTop);
      }
      const g = s('g', { class: 'e k' + e.kind });
      g.appendChild(s('path', { class: 'l', d: rounded(pts, R) }));
      g.appendChild(s('path', { class: 'h', d: 'M' + head.map(p => p[0] + ' ' + p[1]).join('L') + 'Z' }));
      svg.appendChild(g);
      edgeEls.push({ el: g, t: t.key, f: f.key });
    });
    highlight(pinned);
    if (api.onDraw) api.onDraw();
  }

  function rounded(pts, r) {
    // Drop zero-length segments, then round each corner.
    const p = pts.filter((q, i) => !i || q[0] !== pts[i - 1][0] || q[1] !== pts[i - 1][1]);
    let d = 'M' + p[0][0] + ' ' + p[0][1];
    for (let i = 1; i < p.length - 1; i++) {
      const a = p[i - 1], b = p[i], c = p[i + 1];
      const la = Math.hypot(b[0] - a[0], b[1] - a[1]), lc = Math.hypot(c[0] - b[0], c[1] - b[1]);
      const k = Math.min(r, la / 2, lc / 2);
      if (k < 0.5) { d += 'L' + b[0] + ' ' + b[1]; continue; }
      const p1 = [b[0] + (a[0] - b[0]) * k / la, b[1] + (a[1] - b[1]) * k / la];
      const p2 = [b[0] + (c[0] - b[0]) * k / lc, b[1] + (c[1] - b[1]) * k / lc];
      d += 'L' + p1[0] + ' ' + p1[1] + 'Q' + b[0] + ' ' + b[1] + ' ' + p2[0] + ' ' + p2[1];
    }
    const z = p[p.length - 1];
    return d + 'L' + z[0] + ' ' + z[1];
  }

  function highlight(key) {
    root.classList.toggle('hl', key != null);
    const rel = {};
    edgeEls.forEach(e => {
      const on = key != null && (e.t === key || e.f === key);
      e.el.classList.toggle('on', on);
      if (on) { rel[e.t] = rel[e.f] = true; e.el.parentNode.appendChild(e.el); }
    });
    for (const k in cardsByKey) {
      const el = cardsByKey[k].el;
      el.classList.toggle('on', key != null && String(k) === String(key));
      el.classList.toggle('rel', !!rel[k] && String(k) !== String(key));
    }
  }
  const api = {
    el: wrap,
    hover(key) { highlight(key != null ? key : pinned); },
    pin(key) { pinned = key; highlight(key); },
    redraw() { lastW = -1; draw(); },
  };
  const later = () => requestAnimationFrame(draw);
  if (window.ResizeObserver) new ResizeObserver(later).observe(wrap); else window.addEventListener('resize', later);
  later();
  return api;
}

/* ---------- section map box: zoom presets and drag to pan ---------- */
function mapBox(dg) {
  const wrap = dg.el, root = wrap.firstChild;
  const MODES = [['actual', '100%'], ['width', 'Fit width'], ['all', 'Whole map']];
  let mode = 'actual';
  try { const m = localStorage.getItem('progress-map-zoom'); if (MODES.some(x => x[0] === m)) mode = m; } catch (e) { /* no storage */ }
  const btns = {};
  function apply() {
    const w = parseFloat(root.style.width), ht = parseFloat(root.style.height);
    let z = 1;
    if (w && ht && mode !== 'actual') {
      const fitW = (wrap.clientWidth - 2) / w;
      z = mode === 'width' ? fitW : Math.min(fitW, (window.innerHeight - 40) / ht);
    }
    z = Math.min(1, Math.max(0.2, z));
    root.style.zoom = z === 1 ? '' : String(z);
    for (const k in btns) btns[k].setAttribute('aria-pressed', String(k === mode));
  }
  const tools = h('div', { class: 'map-tools' }, 'Zoom',
    MODES.map(([k, label]) => (btns[k] = h('button', { type: 'button', onclick: () => {
      mode = k; try { localStorage.setItem('progress-map-zoom', k); } catch (e) { /* no storage */ }
      apply();
    } }, label))),
    h('span', { class: 'hint' }, 'Drag the map to pan.'));
  dg.onDraw = apply;
  window.addEventListener('resize', () => requestAnimationFrame(apply));

  // Drag to pan with the mouse; a drag never counts as a click on a card.
  let drag = null, moved = false;
  wrap.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    const r = wrap.getBoundingClientRect();
    // Leave the scrollbars to the browser.
    if (e.clientX - r.left - wrap.clientLeft >= wrap.clientWidth || e.clientY - r.top - wrap.clientTop >= wrap.clientHeight) return;
    drag = { x: e.clientX, y: e.clientY, l: wrap.scrollLeft, t: wrap.scrollTop, id: e.pointerId };
    moved = false;
  });
  wrap.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!moved) {
      if (Math.hypot(dx, dy) < 5) return;
      moved = true; wrap.classList.add('dragging'); wrap.setPointerCapture(drag.id);
    }
    wrap.scrollLeft = drag.l - dx; wrap.scrollTop = drag.t - dy;
  });
  const end = () => { if (drag) { drag = null; wrap.classList.remove('dragging'); } };
  wrap.addEventListener('pointerup', end);
  wrap.addEventListener('pointercancel', end);
  wrap.addEventListener('click', e => { if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } }, true);
  wrap.addEventListener('dragstart', e => e.preventDefault());
  apply();
  return h('div', { class: 'mapbox' }, tools, wrap);
}

/* ---------- shared pieces ---------- */
function masthead(title, sub, back) {
  const m = D.meta, when = new Date(m.generated);
  const whenText = when.toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  return h('header', { class: 'masthead' },
    back ? h('a', { class: 'back', href: '#' }, '← All sections') :
      h('div', { class: 'eyebrow' }, ext(repo, m.name), ' · Lean 4 formalization of A. M. Masullo, The Music of the Primes'),
    h('h1', null, title),
    sub ? h('p', { class: 'sub' }, sub) : null,
    h('div', { class: 'stamp' },
      h('span', null, 'Generated ', h('b', null, h('time', { datetime: m.generated }, whenText))),
      h('span', null, 'Commit ', ext(repo + '/commit/' + sha, sha.slice(0, 7), 'mono'), m.subject ? ' ' + cut(m.subject, 70) : ''),
      m.status ? h('span', null, 'README status: ', h('b', null, m.status)) : null));
}
const cut = (t, n) => t.length > n ? t.slice(0, n - 1).trimEnd() + '…' : t;

function legendGlyphs() {
  const item = (cls, text) => h('span', null, h('i', { class: cls }), text);
  return [
    item('g d', 'definition'), item('g t proved', 'theorem, proved'),
    item('g t soft', 'proved, rests on open lemmas'), item('g t claimed', 'claimed'),

/* ---------- problems in the paper (ERRATA.md) ---------- */
const ER = D.errata || { entries: [], gaps: [] };

ER.gaps.forEach(gp => { if (gp.group >= 0) gapsByGroup[gp.group].push(gp); });

/* ---------- pace and contributors ---------- */
// Rates are exponentially weighted counts of proof-issue events: an event `a` seconds before
// the page was generated counts exp(-a / TAU), and the sum over TAU is a rate per second.
const TAU = 2 * 3600;
function pulse() {
  const now = Date.parse(D.meta.generated) / 1000, t = D.totals;
  const perHour = arr => arr.reduce((a, ts) => a + (ts <= now ? Math.exp((ts - now) / TAU) : 0), 0) / TAU * 3600;
  const r1 = v => v >= 10 ? String(Math.round(v)) : (Math.round(v * 10) / 10).toString();
  const closing = perHour(D.timeline.closed), filing = perHour(D.timeline.filed), net = closing - filing;
  const open = t.issuesOpen;
  const stat = (k, v, d) => h('div', { class: 'stat' }, h('span', { class: 'k' }, k),
    h('span', { class: 'v' }, v), d ? h('span', { class: 'd' }, d) : null);
  let finish;
  if (!open) finish = stat('Open issues closed in', '—', 'no proof issue is open');
  else if (closing < 0.05) finish = stat('Open issues closed in', '—', 'no proof issue closed lately');
  else {
    const hrs = open / closing;
    const span = hrs < 1 ? Math.max(1, Math.round(hrs * 60)) + ' min' : hrs < 48 ? Math.round(hrs) + ' h' : (hrs / 24).toFixed(1) + ' days';
    finish = stat('Open issues closed in', '≈ ' + span, 'around ' + new Date((now + hrs * 3600) * 1000).toLocaleString(undefined,
      { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }));
  }
  const pace = h('div', null,
    h('h3', null, 'Pace'),
    h('div', { class: 'stats' },
      stat('Closing', r1(closing) + ' / h', 'proof issues closed'),
      stat('Filed', r1(filing) + ' / h', 'new proof issues (new sorries)'),
      stat('Open issues', open, 'net ' + (net >= 0 ? '−' : '+') + r1(Math.abs(net)) + ' an hour'),
      finish),
    h('div', { class: 'since' }, 'Rates are averages of the proof issues closed and filed, weighted toward the last two hours ' +
      '(an exponential average with a two-hour time constant). The estimate is deliberately optimistic: it is the time to close ' +
      'the issues open now at the current closing rate, and counts none of the issues still to come, from proofs that split ' +
      'into smaller lemmas or from the sections and waves not digested yet.'));

  const M = D.merged;
  if (!M) return h('section', { class: 'pulse' }, pace);
  const tally = rows => {
    const by = {};
    rows.forEach(r => { const e = by[r[0]] || (by[r[0]] = { who: r[0], n: 0, last: 0 }); e.n++; e.last = Math.max(e.last, r[1]); });
    return Object.values(by).sort((a, b) => b.n - a.n || b.last - a.last);
  };
  const RECENT = 3;   // hours
  const all = tally(M), hour = tally(M.filter(r => r[1] > now - RECENT * 3600 && r[1] <= now));
  const site = new URL(repo).origin;
  const person = who => ext(site + '/' + encodeURIComponent(who), who);
  const prs = (who, n, since) => ext(repo + '/pulls?q=' + encodeURIComponent('is:pr is:merged author:' + who +
    (since ? ' merged:>=' + new Date(since * 1000).toISOString().slice(0, 19) + 'Z' : '')), plural(n, 'merged PR'));
  const podium = rows => h('ol', { class: 'podium' }, rows.slice(0, 3).map((e, i) => h('li', null,
    h('span', { class: 'rank' }, i + 1), h('span', { class: 'who' }, person(e.who)), h('span', { class: 'n' }, prs(e.who, e.n, now - RECENT * 3600)))));
  const people = h('div', null,
    h('h3', null, 'Top contributors, last ' + RECENT + ' hours'),
    hour.length ? podium(hour) : h('div', { class: 'muted' }, 'No contributor\u2019s pull request was merged in the ' + RECENT + ' hours before this page was made.'),
    all.length ? h('div', { class: 'hour' }, h('span', { class: 'k' }, 'Top overall'), person(all[0].who), ' · ', prs(all[0].who, all[0].n)) : null,
    h('div', { class: 'since' }, 'Counted by pull requests merged in the ' + RECENT + ' hours before this page was made. The repository owner\u2019s account, which the project\u2019s own agents push from, is left out.'));
  return h('section', { class: 'pulse' }, pace, people);
}

function notes() {
  if (!D.notes.length) return null;

}

    h('span', null, 'A theorem counts as proved when Lean reports no sorry in it. Dependencies are read from the compiled Lean terms, proofs included, not from the source text; auxiliary constants and anonymous instances are folded into the declaration that uses them.'),

/* ---------- proof issues over time ---------- */
function timeline(host) {
  const filed = D.timeline.filed, closed = D.timeline.closed;
  if (!filed.length) return;
  host.appendChild(h('div', { class: 'chart-head' },
    h('h3', null, 'Proof issues filed and closed'),
    h('div', { class: 'chart-legend' },
      h('span', null, h('i', { style: 'background:var(--series-filed)' }), 'filed'),
      h('span', null, h('i', { style: 'background:var(--series-closed)' }), 'closed'))));
  const box = h('div', { class: 'chart' });
  host.appendChild(box);
  host.appendChild(h('div', { class: 'since' }, 'Every sorry gets a proof issue, and the issue closes when the sorry is gone. ' +
    'Theorems proved when they were stated never had one, so more theorems are proved than issues are closed.'));
  const end = Math.max(Date.parse(D.meta.generated) / 1000, filed[filed.length - 1]);
  const start = filed[0] - Math.max(60, (end - filed[0]) * 0.02);
  const countAt = (arr, t) => { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] <= t) lo = m + 1; else hi = m; } return lo; };
  // The smallest round gridline step (1, 2, 2.5 or 5 times a power of ten) that reaches n in at
  // most five steps, so the top of the axis sits just above the highest line.
  const niceAxis = n => {
    n = Math.max(n, 1);
    const p = Math.pow(10, Math.floor(Math.log10(n / 5)));
    for (const m of [1, 2, 2.5, 5, 10, 20, 25, 50]) {
      const step = m * p, k = Math.ceil(n / step);
      if (k <= 5 && step >= 1) return { top: step * k, step, k };
    }
  };
  let lastW = 0;
  function draw() {
    const W = Math.max(260, Math.floor(box.clientWidth));
    if (W === lastW) return;
    lastW = W;
    const H = 178, mL = 34, mR = 78, mT = 8, mB = 22;
    const axis = niceAxis(filed.length * 1.02), top = axis.top, x = t => mL + (W - mL - mR) * (t - start) / (end - start), y = v => mT + (H - mT - mB) * (1 - v / top);
    box.textContent = '';
    const svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img',
      'aria-label': filed.length + ' proof issues filed and ' + closed.length + ' closed so far' });
    for (let i = 0; i <= axis.k; i++) {
      const v = axis.step * i;
      svg.appendChild(s('path', { d: 'M' + mL + ' ' + y(v) + 'H' + (W - mR), stroke: 'var(--line)', 'stroke-width': 1, fill: 'none' }));
      svg.appendChild(s('text', { x: mL - 6, y: y(v) + 4, 'text-anchor': 'end' }, Math.round(v)));
    }
    const span = end - start;
    const steps = [300, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400, 172800, 604800, 1209600, 2592000];
    const step = steps.find(st => span / st <= 5) || steps[steps.length - 1];
    const off = new Date().getTimezoneOffset() * 60;
    let lastDay = '';
    for (let tk = Math.ceil((start - off) / step) * step + off; tk <= end; tk += step) {
      const dt = new Date(tk * 1000), day = dt.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
      const label = step >= 86400 ? day : dt.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) + (lastDay && day !== lastDay ? ' ' + day : '');
      lastDay = day;
      if (x(tk) < mL + 12) continue;
      svg.appendChild(s('path', { d: 'M' + x(tk) + ' ' + (H - mB) + 'v4', stroke: 'var(--line-2)', 'stroke-width': 1 }));
      svg.appendChild(s('text', { x: x(tk), y: H - 5, 'text-anchor': 'middle' }, label));
    }
    const stepPath = arr => {
      let d = 'M' + x(start) + ' ' + y(0), n = 0, i = 0;
      while (i < arr.length) {             // one step per pixel column is plenty
        const tt = arr[i]; let j = i;
        while (j < arr.length && x(arr[j]) - x(tt) < 0.5) j++;
        d += 'H' + x(tt).toFixed(1) + 'V' + y(j).toFixed(1); n = j; i = j;
      }
      return d + 'H' + x(end);
    };
    svg.appendChild(s('path', { d: stepPath(closed) + 'V' + y(0) + 'H' + x(start) + 'Z', fill: 'var(--series-closed)', opacity: .1 }));
    svg.appendChild(s('path', { d: stepPath(filed), fill: 'none', stroke: 'var(--series-filed)', 'stroke-width': 2, 'stroke-linejoin': 'round' }));
    svg.appendChild(s('path', { d: stepPath(closed), fill: 'none', stroke: 'var(--series-closed)', 'stroke-width': 2, 'stroke-linejoin': 'round' }));
    let yf = y(filed.length), yc = y(closed.length);
    if (yc - yf < 14) yc = yf + 14;
    svg.appendChild(s('circle', { cx: x(end), cy: y(filed.length), r: 4, fill: 'var(--series-filed)', stroke: 'var(--bg)', 'stroke-width': 2 }));
    svg.appendChild(s('circle', { cx: x(end), cy: y(closed.length), r: 4, fill: 'var(--series-closed)', stroke: 'var(--bg)', 'stroke-width': 2 }));
    svg.appendChild(s('text', { class: 'endlabel', x: x(end) + 9, y: yf + 4 }, filed.length + ' filed'));
    svg.appendChild(s('text', { class: 'endlabel', x: x(end) + 9, y: yc + 4 }, closed.length + ' closed'));
    const cross = s('path', { d: '', stroke: 'var(--line-2)', 'stroke-width': 1, fill: 'none' });
    svg.appendChild(cross);
    const hit = s('rect', { x: mL, y: mT, width: W - mL - mR, height: H - mT - mB, fill: 'transparent' });
    svg.appendChild(hit);
    box.appendChild(svg);
    const tip = h('div', { class: 'tip', hidden: '' });
    box.appendChild(tip);
    const move = ev => {
      const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
      const tt = clamp(start + (px - mL) / (W - mL - mR) * (end - start), start, end);
      const f = countAt(filed, tt), c = countAt(closed, tt);
      cross.setAttribute('d', 'M' + x(tt) + ' ' + mT + 'V' + (H - mB));
      tip.hidden = false; tip.textContent = '';
      add(tip, [h('div', { class: 'muted' }, new Date(tt * 1000).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })),
        h('div', null, h('b', null, f), ' filed · ', h('b', null, c), ' closed · ', h('b', null, f - c), ' open')]);
      const left = clamp(x(tt) * r.width / W + 10, 0, r.width - tip.offsetWidth - 2);
      tip.style.left = left + 'px'; tip.style.top = '4px';
    };
    hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
    hit.addEventListener('pointerleave', () => { tip.hidden = true; cross.setAttribute('d', ''); });
  }
  const later = () => requestAnimationFrame(draw);
  if (window.ResizeObserver) new ResizeObserver(later).observe(box); else window.addEventListener('resize', later);
  later();
}

/* ---------- one section ---------- */
let pendingDecl = null, pickedItem = null, restore = null;
function declLink(i) {
  const d = D.decls[i], g = D.groups[d[GROUP]];
  return h('a', { href: '#' + g.key, title: g.num + ' ' + g.title, onclick: () => { pendingDecl = i; if (location.hash === '#' + g.key) route(); } }, d[N]);
}
function declRow(i) {
  const d = D.decls[i], meta = h('div', { class: 'decl-meta' });
  const st = h('span', { class: d[KIND] === 't' && d[STATE] === 'proved' ? 'st-proved' : d[STATE] === 'claimed' ? 'st-claimed' : null }, stateText(d));
  meta.appendChild(st);
  if (d[ISSUE]) meta.appendChild(ext(issueUrl(d[ISSUE]), '#' + d[ISSUE]));
  if (d[PAPER]) meta.appendChild(h('span', null, d[PAPER] + ', p. ' + d[PAGE]));
  else meta.appendChild(h('span', null, 'no paper reference'));
  if (d[FLAGS] & 1) meta.appendChild(h('span', null, 'private'));
  if (d[FLAGS] & 2) meta.appendChild(h('span', { title: 'The docstring marks a deviation from the paper' }, 'deviates from the paper'));
  const list = (label, arr) => arr.length ? h('details', { class: 'deps' },
    h('summary', null, label + ' ' + arr.length),
    h('ul', null, arr.map(j => h('li', null, declLink(j))))) : null;
  return h('div', { class: 'decl', 'data-decl': i, 'data-name': d[N] }, glyph(d), h('div', null,
    ext(srcUrl(d), d[N], 'decl-name'), meta,
    d[TEXT] ? h('p', { class: 'decl-doc' }, d[TEXT]) : null,
    list('Statement uses', d[STMT]), list('Proof also uses', d[PROOF]), list('Used by', usedBy[i])));
}

function sectionView(g) {
  const frag = [], isSection = g.id != null;
  const head = masthead(g.num + ' ' + g.title, null, true);
  frag.push(head);

  const kv = h('dl', { class: 'kv' });
  const row = (k, v) => { kv.appendChild(h('dt', null, k)); kv.appendChild(h('dd', null, v)); };
  const secTag = id => { const o = groupById[id]; return h('a', { class: 'tag', href: '#' + o.key, title: o.title + ' — ' + stateWord(o) }, stateIcon(o.state), o.num); };
  if (isSection) {
    row('State', h('span', { class: 'tags' }, h('span', { class: 'tag' }, stateIcon(g.state), stateWord(g)),
      ext(issueUrl(g.id), 'issue #' + g.id), g.pages.length ? h('span', { class: 'muted' }, fmtPages(g.pages)) : null));
    if (g.needs.length) row('Needs', h('span', { class: 'tags' }, g.needs.map(secTag)));
    if ((neededBy[g.id] || []).length) row('Needed by', h('span', { class: 'tags' }, neededBy[g.id].map(secTag)));
  }
  if (g.files.length) row('Files', h('span', { class: 'tags' }, g.files.map(f =>
    ext(repo + '/blob/' + sha + '/' + f, f.replace(/^RiemannMasullo\//, ''), 'mono'))));
  if (g.uses.length) row('Uses Lean from', h('span', { class: 'tags' }, g.uses.map(u => {
    const o = groupByKey[u[0]]; return h('a', { class: 'tag', href: '#' + o.key, title: plural(u[1], 'reference') }, o.num, h('span', { class: 'muted num' }, '×' + u[1]));
  })));

  const nDecl = g.defs + g.thms;
  const summary = () => [
    h('div', { class: 'panel-head' }, h('h3', null, nDecl ? g.proved + ' of ' + g.thms + ' theorems proved' : 'Nothing stated yet')),
    nDecl ? h('div', { class: 'meter' },
      g.proved ? h('i', { class: 'm-solid', style: 'flex:' + g.solid + ' 1 0' }) : null,
      g.proved - g.solid ? h('i', { class: 'm-soft', style: 'flex:' + (g.proved - g.solid) + ' 1 0' }) : null,
      g.claimed ? h('i', { class: 'm-claimed', style: 'flex:' + g.claimed + ' 1 0' }) : null,
      g.thms - g.proved - g.claimed ? h('i', { class: 'm-open', style: 'flex:' + (g.thms - g.proved - g.claimed) + ' 1 0' }) : null) : null,
    nDecl ? h('div', { class: 'muted' }, plural(g.defs, 'definition') + ' · ' + plural(g.thms, 'theorem') + ' · ' +
      g.claimed + ' claimed · ' + (g.thms - g.proved - g.claimed) + ' open' + (g.unfiled ? ' (' + g.unfiled + ' without an issue)' : '')) :
      h('div', { class: 'muted' }, isSection ? (g.state === 'blocked' ? 'This section is waiting for the sections it needs. Its statements appear here once a digester has written them.' :
        'No Lean statements for this section are on main yet.') : ''),
    kv,
    nDecl ? h('div', { class: 'muted' }, 'Select an item in the diagram to list its Lean declarations with their issues and source lines.') : null,
  ];

  const panel = h('aside', { class: 'panel', 'aria-live': 'polite' });
  let dg = null, selected = null;
  const cardEls = {};
  function showSummary() {
    selected = null; pickedItem = null; panel.classList.remove('picked'); panel.textContent = ''; add(panel, summary());
    if (dg) dg.pin(null);
    for (const k in cardEls) cardEls[k].classList.remove('sel');
  }
  function select(k, declIdx) {
    selected = k;
    const it = g.items[k];
    pickedItem = it.key;
    for (const key in cardEls) cardEls[key].classList.toggle('sel', String(key) === String(k));
    if (dg) dg.pin(k);
    panel.classList.add('picked'); panel.textContent = '';
    const ths = it.decls.filter(i => D.decls[i][KIND] === 't');
    add(panel, [
      h('div', { class: 'panel-head' },
        h('div', null, h('h3', null, it.label), h('div', { class: 'muted' },
          (it.page ? 'p. ' + it.page + ' · ' : '') + plural(it.decls.length, 'declaration') +
          (ths.length ? ' · ' + ths.filter(i => D.decls[i][STATE] === 'proved').length + '/' + ths.length + ' theorems proved' : ''))),
        h('button', { class: 'x', type: 'button', onclick: showSummary }, 'Close')),
      h('div', { class: 'decls' }, it.decls.map(declRow))]);
    panel.scrollTop = 0;
    if (declIdx != null) {
      const el = panel.querySelector('[data-decl="' + declIdx + '"]');
      if (el) { el.scrollIntoView({ block: 'nearest' }); el.querySelector('a').focus({ preventScroll: true }); }
    }
  }

  let main;
  if (g.items.length) {
    g.items.forEach((it, k) => {
      const ths = it.decls.filter(i => D.decls[i][KIND] === 't');
      const done = ths.length && ths.every(i => D.decls[i][STATE] === 'proved');
      const el = h('button', { type: 'button', class: 'card item' + (done ? ' done' : ''), 'data-item': it.key,
        title: it.label + (it.page ? ', p. ' + it.page : '') + ' — ' + plural(it.decls.length, 'declaration') });
      const gl = h('span', { class: 'gl' }), cap = 22;
      it.decls.slice(0, it.decls.length > cap ? cap - 2 : cap).forEach(i => gl.appendChild(glyph(D.decls[i], i)));
      if (it.decls.length > cap) gl.appendChild(h('span', { class: 'more' }, '+' + (it.decls.length - cap + 2)));
      el.appendChild(h('span', { class: 'lab' }, it.label)); el.appendChild(gl);
      el.addEventListener('click', ev => {       // a click on one mark opens the item at that declaration
        const mark = ev.target.closest && ev.target.closest('.g');
        if (mark) select(k, +mark.getAttribute('data-d')); else if (selected === k) showSummary(); else select(k);
      });
      el.addEventListener('mouseenter', () => dg.hover(k)); el.addEventListener('mouseleave', () => dg.hover(null));
      el.addEventListener('focus', () => dg.hover(k)); el.addEventListener('blur', () => dg.hover(null));
      cardEls[k] = el;
    });
    const bandTitle = {}; g.bands.forEach(b => { bandTitle[b[0]] = b[1]; });
    dg = diagram({
      minPitch: 158, maxPitch: 230, cardH: 56, gapX: 24, gap: 40, edges: g.edges,
      layout: cols => {
        const cards = [], heads = []; let rowNo = 0, band = null, col = 0;
        g.items.forEach((it, k) => {
          if (it.band !== band) {
            if (col) { rowNo++; col = 0; }
            band = it.band;
            if (g.bands.length > 1 || bandTitle[band]) heads.push({ row: rowNo, h: 30,
              el: h('div', { class: 'band-head' }, h('b', null, band ? '§' + band : 'Other'), h('span', null, bandTitle[band] || '')) });
          }
          cards.push({ key: k, col, row: rowNo, el: cardEls[k] });
          if (++col === cols) { col = 0; rowNo++; }
        });
        return { cards, heads };
      },
    });
    main = h('div', null,
      h('div', { class: 'section-head', style: 'margin-bottom:14px' },
        h('p', null, 'Paper items in paper order. Each mark is one Lean declaration; an arrow runs from an item to one that uses it.'),
        h('div', { class: 'legend' }, legendGlyphs(), h('i', { class: 'sep' }),
          legendEdge(true, 'used in a statement'), legendEdge(false, 'used only in a proof'))),
      dg.el);
  } else {
    main = h('div', { class: 'wave' }, h('div', { class: 'wave-head' }, h('b', null, 'No Lean statements yet'),
      h('span', null, isSection ? STATE_WORD[g.state] : '')),
      h('div', { class: 'muted' }, g.needs.length ? 'It needs ' + g.needs.map(n => groupById[n].num).join(', ') + ' first.' : 'Nothing has been written for this part.'));
  }
  frag.push(h('div', { class: 'split' }, main, panel));
  {
    const gi = D.groups.indexOf(g), pl = probsByGroup[gi], gl = gapsByGroup[gi];
    if (pl.length || gl.length) frag.push(h('details', { class: 'block', open: '' },
      h('summary', null, 'Problems in the paper (' + pl.length + ')'),
      h('p', { class: 'muted' }, 'Entries of ', ext(errataUrl, 'ERRATA.md'), ' whose page falls in this section.'),
      gl.length ? gapList(gl) : null, probList(pl)));
  }
  showSummary();

  /* table of every declaration, built when opened */
  if (nDecl) {
    const holder = h('div', { class: 'tbl' });
    const det = h('details', { class: 'block' }, h('summary', null, 'All ' + plural(nDecl, 'declaration') + ' as a table'), holder);
    det.addEventListener('toggle', () => {
      if (!det.open || holder.firstChild) return;
      const tb = h('tbody');
      g.items.forEach(it => it.decls.forEach(i => {
        const d = D.decls[i];
        tb.appendChild(h('tr', null,
          h('td', { class: 'name' }, glyph(d), ext(srcUrl(d), d[N])),
          h('td', null, stateText(d)), h('td', null, d[PAPER] || it.label),
          h('td', { class: 'r' }, d[PAGE] || ''), h('td', null, d[ISSUE] ? ext(issueUrl(d[ISSUE]), '#' + d[ISSUE]) : '')));
      }));
      holder.appendChild(h('table', null, h('thead', null, h('tr', null, h('th', null, 'Declaration'), h('th', null, 'State'),
        h('th', null, 'Paper item'), h('th', { class: 'r' }, 'Page'), h('th', null, 'Issue'))), tb));
    });
    frag.push(det);
  }
  frag.push(footer());

  if (pendingDecl != null && D.decls[pendingDecl][GROUP] === g.idx) {
    const i = pendingDecl; pendingDecl = null;
    requestAnimationFrame(() => select(itemOf[i], i));
  } else if (restore && restore.hash === location.hash) {
    const k = g.items.findIndex(it => it.key === restore.item);
    if (k >= 0) requestAnimationFrame(() => select(k));
  }
  pendingDecl = null; restore = null;
  return frag;
}

/* ---------- routing ---------- */
function route() {
  const key = decodeURIComponent(location.hash.replace(/^#/, ''));
  const g = groupByKey[key];
  app.textContent = '';
  add(app, g ? sectionView(g) : overview());
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
// When the page is republished while someone has it open, the viewer hands the new copy what
// the old one saved here: the item that was selected, by its stable key.
let started = false;
function start(saved) {
  if (started) return;
  started = true; restore = saved && saved.item ? saved : null; route();
}
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ hash: location.hash, item: pickedItem })); } catch (e) { /* not in a viewer */ }
if (hot && hot.ready) {
  try { hot.ready(start); } catch (e) { /* fall through to the timer */ }
  setTimeout(() => start({}), 1500);      // never leave the page blank waiting for the viewer
} else start(hot && hot.data || {});
})();
</script>
